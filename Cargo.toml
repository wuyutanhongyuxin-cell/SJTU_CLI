[package]
name = "sjtu-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "SJTU JAccount 命令行工具：扫码登录后一行命令查课表 / 成绩 / 一卡通 / 通知 / Canvas"
license = "MIT"
readme = "README.md"
keywords = ["sjtu", "jaccount", "cli", "student"]
categories = ["command-line-utilities"]

[[bin]]
name = "sjtu"
path = "src/main.rs"

[lib]
name = "sjtu_cli"
path = "src/lib.rs"

[dependencies]
# --- S0 基础设施 ---
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
directories = "5"
is-terminal = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
thiserror = "2"

# --- S1 扫码登录 ---
headless_chrome = "1"
qrcode = "0.14"
image = { version = "0.25", default-features = false, features = ["png"] }
rqrr = "0.7"
rookie = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- S2 CAS 子系统跳转 ---
reqwest = { version = "0.12", default-features = false, features = ["cookies", "json", "rustls-tls", "gzip"] }
# `fs` + `io-util`：CP-V3 mp4 Range 分片下载需要异步 read/write/rename/mkdir。
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "net"] }
url = "2"

# --- S3e 生活服务（电费）金额硬约束：禁 f64，所有金额 / 度数走 Decimal ---
rust_decimal = { version = "1", features = ["serde"] }

# --- T1 jwc 课表 grid 渲染 ---
# 锁 7.1.x：7.2 MSRV 1.85 超项目 rust-version 1.75
comfy-table = "~7.1"

# --- T4 weixin path HTML 解析 ---
scraper = "0.21"

# XML 解析：Zimbra SOAP envelope 用（apps/mail/）
quick-xml = { version = "0.34", features = ["serialize"] }

[dev-dependencies]
mockito = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util", "fs", "io-util", "net"] }
